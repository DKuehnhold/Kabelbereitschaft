# Overlay Stage. Immer gemeinsam mit compose.yml verwenden:
#   docker compose -f deploy/compose.yml -f deploy/compose.stage.yml ...
#
# Stage fuehrt gemaess V1 (Aufbewahrungsfristen offen) ausschliesslich
# synthetische Personen-, EXIF- und GPS-Daten. Produktiver Datenanfall ist
# gesperrt.

services:
  app:
    environment:
      APP_ENVIRONMENT: stage
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 256m

  postgres:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 256m
