name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # @public-E2E (ohne Supabase). Vollständige @app-E2E benötigen Test-Supabase-Secrets
      # (siehe E2E_TESTS.md); ohne diese werden @app-Tests automatisch übersprungen.
      - name: E2E (öffentliche PWA-/Guard-Tests)
        run: npx playwright test public.spec.ts
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Für vollständige App-E2E in CI zusätzlich als GitHub Secrets bereitstellen:
          #   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
          #   E2E_ADMIN_EMAIL/PASSWORD, E2E_DISPO_*, E2E_MONTEUR_*, E2E_MONTEUR2_*, E2E_INCIDENT_ID
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Playwright-Report (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
