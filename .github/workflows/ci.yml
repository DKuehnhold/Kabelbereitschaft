name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# AP14/A7: minimale Rechte fuer den GITHUB_TOKEN. Dieser Workflow liest nur.
# Ein Registry-Push findet ausschliesslich in container-image.yml statt und
# erhaelt dort gezielt packages: write.
permissions:
  contents: read

# AP14/A7: verhindert parallele Laeufe derselben Referenz. Deployments und
# Image-Pushes derselben Umgebung koennen sich damit nicht ueberholen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      # AP15-3: hartes Unit-Test-Gate. Die vier Dateien app/test/*.test.mjs
      # liefen bisher in KEINEM CI-Job und wurden nur lokal ausgefuehrt. Sie
      # brauchen weder Datenbank noch Objektspeicher noch ein Secret und laufen
      # deshalb hier - bewusst OHNE continue-on-error: ein roter Unit-Test
      # bricht den Job ab. Die Arbeitsverzeichnisangabe kommt aus
      # defaults.run.working-directory (app).
      - name: Unit-Tests (hartes Gate)
        run: npm run test:unit

      # AP14/A8: der Service Worker ist handgeschrieben und wird von keinem
      # Build-Schritt geprueft. node --check faellt bei Syntaxfehlern auf.
      - name: Service-Worker-Syntax
        run: |
          node --check public/sw.js
          node --check docker/healthcheck.mjs
          node --check docker/verify-runtime-config.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Supply-Chain-Audit, zweistufig (Entscheidung 2026-07-28, siehe SICHERHEIT.md):
      #   1. Produktionsabhängigkeiten sind das harte Gate bei hoch/kritisch. postcss und sharp
      #      werden über `overrides` in package.json auf gepatchte Versionen gezogen.
      #   2. Die Dev-Kette (eslint 9 → minimatch 3 → brace-expansion 1.x) hat upstream keinen
      #      Fix ohne Wechsel auf eslint 10 (Breaking Change). Sie wird deshalb ausdrücklich
      #      ausgenommen und nur informativ berichtet — nicht blockierend, aber sichtbar.
      - name: Audit Produktion (high/critical als Gate)
        run: npm audit --audit-level=high --omit=dev

      - name: Audit Entwicklung (informativ, nicht blockierend)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # @public-E2E (ohne Anmeldung und ohne Datenbank) inkl. Accessibility (axe).
      # Vollständige @app-E2E benötigen eine Testdatenbank der internen Plattform und
      # Testbenutzer (siehe E2E_TESTS.md); ohne diese werden @app-Tests übersprungen.
      - name: E2E + a11y (öffentliche Tests)
        run: npx playwright test --grep @public
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Für vollständige App-E2E in CI wären zusätzlich bereitzustellen:
          #   DATABASE_URL, AUTH_SECRET (Pflichtnamen aus app/src/lib/platform-config.ts),
          #   E2E_ADMIN_EMAIL/PASSWORD, E2E_DISPO_*, E2E_MONTEUR_*, E2E_MONTEUR2_*, E2E_INCIDENT_ID
          # Bewusst noch KEINE secrets.*-Referenz: es ist nicht belegt, dass diese Secrets im
          # Repository existieren. Ein Verweis auf ein fehlendes Secret ergibt eine leere
          # Zeichenkette und damit einen stillen Fehlzustand statt eines sichtbaren Skips.

      - name: Upload Playwright-Report (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # AP14/A10: die SQL-Smokes liefen bisher ausschliesslich lokal ueber
  # run_ap12_local.ps1 (PowerShell/Windows). Hier laufen dieselben Dateien in
  # derselben Reihenfolge gegen einen PostgreSQL-18-Service.
  #
  # AP14/B: nach der SQL-Kette laufen zusaetzlich Node-Integrationssuiten mit
  # echtem Anwendungscode gegen dieselbe temporaere Datenbank. Seit AP15-b sind
  # es SECHS Suiten, und sie laufen in dieser festen Reihenfolge:
  #   1. ap14b-platform.int.mjs              (app/src/lib/db, auth-service)
  #   2. ap14b-masterdata-inventory.int.mjs  (masterdata*, inventory*)
  #   3. ap14b-images.int.mjs                (Bildpfad gegen den prozessinternen
  #      synthetischen S3-Testendpunkt - KEIN MinIO; der MinIO-Nachweis bleibt
  #      der getrennte Job "objectstore")
  #   4. ap14b-admin-users.int.mjs           (app/src/lib/admin-users.ts)
  #   5. ap15-dashboard-metrics.int.mjs      (app/src/lib/incident-metrics.ts)
  #   6. ap15b-incident-list.int.mjs         (Fehlalarmpfad in
  #      app/src/lib/incidents.ts und Vollmengen-Export ueber
  #      app/src/lib/incident-list-actions.ts)
  # Die Reihenfolge 1 vor 4 ist ZWINGEND (Fall I13 der Plattformsuite setzt
  # `usableAdminCount() == 0` voraus, und die Konten der Suite 4 tragen echte
  # Argon2id-Hashes, die dort mitgezaehlt wuerden).
  # Die Stellung von 6 AM ENDE ist ebenfalls begruendet: Suite 6 legt zum
  # Nachweis der Vollmengengrenze INCIDENT_FULL_EXPORT_CAP + 1 Vorgaenge an, und
  # diese Zeilen ueberdauern den Lauf, weil public.incidents wegen der
  # unbedingten Loeschsperre trg_incident_tasks_no_delete nicht per DELETE
  # aufgeraeumt werden kann. Suiten, die ueber die gesamte sichtbare Menge
  # zaehlen - namentlich Suite 5 -, wuerden dadurch deutlich langsamer.
  #
  # Alle sechs laufen FAIL-CLOSED und doppelt gesichert:
  #   1. AP14B_INTEGRATION: require - run_db_tests.sh bricht mit einem Exitcode
  #      ungleich 0 ab, sobald eine Voraussetzung fehlt (node, node_modules/pg,
  #      Testdateien, Zufallsquelle, Rollenanlage).
  #   2. Das Skript setzt fuer JEDEN der sechs Node-Laeufe zusaetzlich
  #      AP14B_REQUIRE_INTEGRATION=1; ein leerer oder falscher Verbindungswert
  #      fuehrt dort zum Abbruch beim Laden des Moduls statt zu einem Skip.
  # Ein fehlender Verbindungswert kann damit keinen gruenen Lauf ohne Nachweis
  # erzeugen. Deshalb sind hier auch setup-node und "npm ci" noetig: ohne
  # app/node_modules faende das Skript kein pg und wuerde abbrechen.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: ci_only_not_a_secret
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: PostgreSQL-Client installieren
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Datenbankpruefungen (Migrationen 0001-0018, Smokes 15-25, sechs Integrationssuiten)
        run: |
          chmod +x supabase/test/run_db_tests.sh
          supabase/test/run_db_tests.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci_only_not_a_secret
          # Pflichtmodus: ALLE SECHS Integrationssuiten MUESSEN laufen und
          # MUESSEN gelingen (Reihenfolge und Begruendung im Kommentar oben).
          AP14B_INTEGRATION: require

  # AP14/A8: Containerbau und Stack-Validierung. Kein Push, kein Deployment.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile-Lint (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - uses: docker/setup-buildx-action@v3

      # Build ohne Push. NEXT_PUBLIC_*-Platzhalter werden hier bewusst NICHT
      # gesetzt: der Build muss ohne Umgebungswerte gelingen. Die fehlende
      # Konfiguration faellt erst beim Containerstart auf (Exit-Code 78).
      - name: Docker-Build (BuildKit, ohne Push)
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: false
          load: true
          tags: kabelbereitschaft:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Startvalidierung muss ohne Konfiguration fehlschlagen
        run: |
          set +e
          output="$(docker run --rm kabelbereitschaft:ci 2>&1)"
          code=$?
          set -e
          echo "${output}"
          if [ "${code}" -ne 78 ]; then
            echo "Erwartet war Exit-Code 78 (fehlende Konfiguration), erhalten: ${code}" >&2
            exit 1
          fi
          # DATABASE_URL fehlt ohne Konfiguration zwingend und steht dauerhaft in
          # REQUIRED (app/docker/verify-runtime-config.mjs).
          echo "${output}" | grep -q "DATABASE_URL" || {
            echo "Meldung nennt die fehlende Plattformvariable nicht." >&2
            exit 1
          }
          # Zweite Zusicherung: auch der Objektspeicher ist Pflicht. Faellt die
          # MinIO-Pflicht kuenftig weg, schlaegt diese Zeile auf und der Wegfall
          # bleibt nicht unbemerkt.
          echo "${output}" | grep -q "S3_SECRET_ACCESS_KEY" || {
            echo "Meldung nennt die fehlende Objektspeichervariable nicht." >&2
            exit 1
          }

      # Die Altmuster bleiben bewusst stehen: eine Supabase-Variable in einem Layer
      # ist auch nach der Abloesung ein Fund.
      - name: Keine Secrets in den Image-Layern
        run: |
          if docker history --no-trunc --format '{{.CreatedBy}}' kabelbereitschaft:ci \
              | grep -Ei 'SUPABASE_SERVICE_ROLE_KEY|ANON_KEY=|AUTH_SECRET|PASSWORD=|S3_SECRET_ACCESS_KEY|S3_ACCESS_KEY_ID'; then
            echo "Verdaechtiger Wert in einem Image-Layer gefunden." >&2
            exit 1
          fi
          echo "docker history unauffaellig."

      - name: Compose-Modell validieren
        working-directory: .
        run: |
          cp deploy/env/app.env.example deploy/env/app.env
          cp deploy/env/postgres.env.example deploy/env/postgres.env
          cp deploy/env/minio.env.example deploy/env/minio.env
          export APP_IMAGE_REF=kabelbereitschaft:ci
          # Pflichtvariable des Objektspeicherdienstes. Erkennbarer
          # CI-Platzhalter, wie bei APP_IMAGE_REF - es wird nichts gezogen und
          # nichts gestartet, "config" prueft nur das Modell.
          #
          # MINIO_CLIENT_IMAGE_REF steht hier bewusst NICHT mehr: seit dem
          # Wegfall des automatischen Bootstraps referenziert deploy/compose.yml
          # diese Variable nicht mehr (siehe den Hinweisblock am Ende der Datei),
          # ein Export waere wirkungslos.
          export MINIO_IMAGE_REF=minio-server:ci
          docker compose -f deploy/compose.yml -f deploy/compose.stage.yml config >/dev/null
          docker compose -f deploy/compose.yml -f deploy/compose.production.yml config >/dev/null
          rm -f deploy/env/app.env deploy/env/postgres.env deploy/env/minio.env
          echo "Compose-Konfiguration gueltig (stage und production)."

      # Informativ, nicht blockierend: die Basiszeile an Basisimage-CVEs ist
      # noch nicht festgelegt. Nach der ersten Auswertung wird daraus ein
      # Gate - analog zum zweistufigen npm-audit.
      - name: Image-Scan (Trivy, informativ)
        continue-on-error: true
        # v0.36.0, auf unveraenderlichen Commit gepinnt (Supply-Chain-Schutz).
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: kabelbereitschaft:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  # AP14/B: ECHTER MinIO-NACHWEIS.
  #
  # Abgrenzung, die dieser Job aufloest: app/test/integration/s3-test-endpoint.mjs
  # ist ein SYNTHETISCHER, im Arbeitsspeicher gehaltener S3-Endpunkt und
  # ausdruecklich KEIN MinIO-Nachweis (die Abgrenzung steht dort im Kopf der
  # Datei). Hier laeuft derselbe Produktivcode (app/src/lib/minio-storage.ts ueber
  # das echte AWS SDK v3) gegen einen WIRKLICHEN MinIO-Container mit echter
  # Bucket-Policy, echter Benutzerverwaltung und echten S3-Fehlercodes.
  #
  # Der Server laeuft bewusst NICHT als "services:"-Eintrag: ein Service-Container
  # kann sein Kommando nicht ueberschreiben, MinIO braucht aber "server /data".
  # Er wird deshalb in einem normalen Schritt per "docker run" gestartet; Docker
  # ist auf ubuntu-latest vorhanden.
  #
  # Beide Images sind digest-fest referenziert (Tag NUR zur Lesbarkeit, der
  # Digest entscheidet). Kein "latest", kein beweglicher Tag.
  objectstore:
    runs-on: ubuntu-latest
    env:
      # Digest-feste Image-Referenzen. Bei einer Aktualisierung muss der Digest
      # erneut bei der Registry abgefragt und hier mitgezogen werden.
      MINIO_SERVER_IMAGE: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
      MINIO_CLIENT_IMAGE: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
      MINIO_NETWORK: kb-objectstore-ci
      MINIO_CONTAINER: kb-objectstore-ci-server
      # Der Bucketname ist NICHT frei waehlbar: er steht so in der versionierten
      # Policy deploy/minio/incident-images-app.policy.json
      # (arn:aws:s3:::incident-images/*). Genau diese Datei wird unten geladen.
      S3_BUCKET: incident-images
      # Zweiter Bucket ausschliesslich als GEGENPROBE der Rechtebegrenzung. Ohne
      # ihn waere eine Abweisung ausserhalb des einen Buckets nicht von einem
      # "Bucket existiert nicht" zu unterscheiden.
      AP14B_MINIO_FOREIGN_BUCKET: ci-gegenprobe-fremder-bucket
      # SYNTHETISCHE CI-Zugangsdaten im Klartext, im selben Stil wie
      # POSTGRES_PASSWORD: ci_only_not_a_secret im Job "database". Bewusst KEINE
      # secrets.*-Referenz: es ist nicht belegt, dass solche Secrets im Repository
      # existieren, und ein Verweis auf ein fehlendes Secret ergibt eine leere
      # Zeichenkette und damit einen stillen Fehlzustand.
      #
      # Root- und Anwendungsidentitaet sind ABSICHTLICH verschieden. Waeren sie
      # gleich, liefe der Test mit Administratorrechten und wuerde die
      # Rechtebegrenzung der Policy gar nicht messen.
      MINIO_ROOT_USER: ciminiorootnotasecret
      MINIO_ROOT_PASSWORD: ciminiorootpassnotasecret
      S3_ACCESS_KEY_ID: ciappidentitynotasecret
      S3_SECRET_ACCESS_KEY: ciappsecretnotasecret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: MinIO starten (echter Container, digest-fest)
        run: |
          docker network create "${MINIO_NETWORK}"
          # DURCHREICHFORM "--env NAME" OHNE "=wert": Docker uebernimmt den Wert
          # aus der Umgebung dieses Schrittes. Damit steht in der Kommandozeile
          # und in der Prozessliste ausschliesslich der NAME der Variablen,
          # niemals ihr Wert. Diese Form ist zugleich der Nachweis, dass eine
          # argumentfreie Uebergabe von Zugangsdaten an den MinIO-Container
          # funktioniert - Voraussetzung fuer jede spaetere, geheimnisfreie
          # Wiedereinfuehrung einer automatischen Provisionierung.
          docker run --detach \
            --name "${MINIO_CONTAINER}" \
            --network "${MINIO_NETWORK}" \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER \
            --env MINIO_ROOT_PASSWORD \
            "${MINIO_SERVER_IMAGE}" \
            server /data

      # Fail-closed: kommt der Server nicht hoch, schlaegt der Job fehl. Kein
      # Ueberspringen, kein "|| true", kein continue-on-error.
      - name: Auf MinIO warten
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 5 \
                http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO ist bereit (Versuch ${attempt})."
              exit 0
            fi
            sleep 2
          done
          echo "MinIO wurde binnen 60 Sekunden nicht bereit." >&2
          # Bewusst KEIN "docker logs": das Startbanner von MinIO kann die
          # Root-Zugangsdaten enthalten. Ausgegeben wird nur der Containerstatus.
          docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' \
            "${MINIO_CONTAINER}" >&2
          exit 1

      # =====================================================================
      # DIES IST DER CI-NACHWEIS UND AUSDRUECKLICH NICHT DER PRODUKTIVE
      # BOOTSTRAP.
      #
      # Der produktive Stack provisioniert bewusst NICHT mehr automatisch; die
      # Provisionierung ist ein dokumentierter Schritt der internen IT (siehe
      # deploy/README.md, Abschnitt "MinIO-Provisionierung durch die interne IT",
      # und den Hinweisblock am Ende von deploy/compose.yml). Hier wird
      # ausschliesslich der Zustand hergestellt, gegen den der Nachweis laeuft.
      #
      # Laeuft dieser Job gruen, ist genau das der Beleg, der eine spaetere,
      # geheimnisfreie Wiedereinfuehrung einer automatischen Provisionierung
      # ueberhaupt erst begruendbar macht: er zeigt, dass Bucket, Policy und
      # Anwendungsidentitaet ohne einen einzigen Zugangsdatenwert auf einer
      # Kommandozeile eingerichtet werden koennen.
      # =====================================================================
      - name: MinIO provisionieren (nur fuer diesen Nachweis)
        run: |
          # MC_HOST_<alias> traegt die Root-Zugangsdaten. Es ist eine
          # Umgebungsvariable dieses Schrittes und wird - wie oben - ueber die
          # Durchreichform "--env MC_HOST_ci" ohne "=wert" an den Client
          # gereicht. "export" ist ein Shell-Builtin und erzeugt keinen Prozess;
          # der Wert steht damit in keiner Kommandozeile.
          export MC_HOST_ci="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@${MINIO_CONTAINER}:9000"

          # Einmalcontainer im selben Docker-Netz wie der Server. Die
          # versionierte Policy wird NUR GEMOUNTET und nicht neu geschrieben -
          # geprueft wird damit genau die Datei aus dem Repository.
          run_mc() {
            docker run --rm --interactive \
              --network "${MINIO_NETWORK}" \
              --env MC_HOST_ci \
              --volume "${GITHUB_WORKSPACE}/deploy/minio:/policy:ro" \
              "${MINIO_CLIENT_IMAGE}" "$@"
          }

          run_mc mb "ci/${S3_BUCKET}"
          run_mc mb "ci/${AP14B_MINIO_FOREIGN_BUCKET}"

          # Anonyme Freigabe fail-closed abschalten. Ein frischer Bucket hat
          # zwar keine, der Zustand wird aber gesetzt und danach abgefragt.
          # WICHTIG - Setzverb und gemeldeter Zustand sind NICHT dieselbe
          # Zeichenfolge: das mc-Setzverb heisst "none", die oben digest-fest
          # gepinnte mc-Version (Zeile 252, RELEASE.2025-08-13T08-35-41Z)
          # meldet denselben Zustand bei "anonymous get" jedoch als "private".
          # So belegt im CI-Lauf 30689463269, in dem "set none" erfolgreich war
          # und allein die Zustandspruefung fehlschlug. Geprueft wird deshalb
          # genau dieser Begriff. Wird der Digest gewechselt, ist die
          # Schreibweise des gemeldeten Zustands erneut zu pruefen.
          run_mc anonymous set none "ci/${S3_BUCKET}"
          run_mc anonymous set none "ci/${AP14B_MINIO_FOREIGN_BUCKET}"
          anonymous_state="$(run_mc anonymous get "ci/${S3_BUCKET}")"
          case "${anonymous_state}" in
            *private*) echo "Anonyme Freigabe des Buckets steht auf private." ;;
            *)
              echo "Anonyme Freigabe des Buckets steht NICHT auf private." >&2
              exit 1
              ;;
          esac

          run_mc admin policy create ci incident-images-app \
            /policy/incident-images-app.policy.json

          # Anwendungsidentitaet anlegen. "mc admin user add" nimmt Zugangsdaten
          # auch als Argumente - genau das ist hier verboten. Ohne Argumente
          # liest mc auf einem nicht-interaktiven stdin zwei Zeilen:
          # Zugriffsschluessel, dann Geheimnis. "printf" ist ein Shell-Builtin,
          # es entsteht also kein Prozess, dessen Argumentliste das Geheimnis
          # enthielte.
          printf '%s\n%s\n' "${S3_ACCESS_KEY_ID}" "${S3_SECRET_ACCESS_KEY}" \
            | run_mc admin user add ci

          # Der Zugriffsschluessel ist KEIN Geheimnis: er steht in jeder
          # signierten URL im Klartext (X-Amz-Credential). Das Geheimnis
          # erscheint an keiner Stelle als Argument.
          run_mc admin policy attach ci incident-images-app \
            --user "${S3_ACCESS_KEY_ID}"

          # Fail-closed: der Zielzustand wird ausdruecklich abgefragt. Kein
          # "|| true". Der Vergleich laeuft ueber "case" (Shell-Builtin), damit
          # der Zugriffsschluessel nicht als Argument an ein Suchwerkzeug geht.
          policy_entities="$(run_mc admin policy entities ci \
            --policy incident-images-app --json)"
          case "${policy_entities}" in
            *"${S3_ACCESS_KEY_ID}"*)
              echo "Policy incident-images-app ist der Anwendungsidentitaet zugeordnet."
              ;;
            *)
              echo "Policy incident-images-app ist NICHT zugeordnet." >&2
              exit 1
              ;;
          esac

      # Der eigentliche Nachweis. Node fuehrt die TypeScript-Module des
      # Produktivcodes mit Typentfernung aus; die Aufloesung von "server-only"
      # und "@/..." leistet test/integration/module-hooks.mjs.
      - name: MinIO-Live-Nachweis (Produktivcode gegen echtes MinIO)
        run: |
          node --import ./test/integration/module-hooks.mjs \
            test/integration/ap14b-minio-live.int.mjs
        env:
          # Loopback: minio-config.ts laesst denselben Origin fuer Endpunkt und
          # Signierbasis ausschliesslich dann zu, wenn BEIDE Hostnamen Loopback
          # sind. 127.0.0.1 erfuellt das, und nur so ist die signierte URL vom
          # Runner aus auch tatsaechlich abrufbar.
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_PUBLIC_BASE_URL: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_FORCE_PATH_STYLE: "true"
          # AUTH_URL wird bewusst NICHT gesetzt: waere sie gesetzt, verlangte
          # readMinioConfig() denselben Origin wie die Signierbasis.

      - name: MinIO entfernen
        if: always()
        run: |
          # Kein "|| true": es wird ausdruecklich geprueft, ob es ueberhaupt
          # etwas zu entfernen gibt.
          if [ -n "$(docker ps --all --quiet --filter "name=^${MINIO_CONTAINER}$")" ]; then
            docker rm --force "${MINIO_CONTAINER}"
          fi
          if [ -n "$(docker network ls --quiet --filter "name=^${MINIO_NETWORK}$")" ]; then
            docker network rm "${MINIO_NETWORK}"
          fi
