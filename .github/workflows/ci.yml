name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Supply-Chain-Audit, zweistufig (Entscheidung 2026-07-28, siehe SICHERHEIT.md):
      #   1. Produktionsabhängigkeiten sind das harte Gate bei hoch/kritisch. postcss und sharp
      #      werden über `overrides` in package.json auf gepatchte Versionen gezogen.
      #   2. Die Dev-Kette (eslint 9 → minimatch 3 → brace-expansion 1.x) hat upstream keinen
      #      Fix ohne Wechsel auf eslint 10 (Breaking Change). Sie wird deshalb ausdrücklich
      #      ausgenommen und nur informativ berichtet — nicht blockierend, aber sichtbar.
      - name: Audit Produktion (high/critical als Gate)
        run: npm audit --audit-level=high --omit=dev

      - name: Audit Entwicklung (informativ, nicht blockierend)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # @public-E2E (ohne Supabase) inkl. Accessibility (axe). Vollständige @app-E2E benötigen
      # Test-Supabase-Secrets (siehe E2E_TESTS.md); ohne diese werden @app-Tests übersprungen.
      - name: E2E + a11y (öffentliche Tests)
        run: npx playwright test --grep @public
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Für vollständige App-E2E in CI zusätzlich als GitHub Secrets bereitstellen:
          #   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
          #   E2E_ADMIN_EMAIL/PASSWORD, E2E_DISPO_*, E2E_MONTEUR_*, E2E_MONTEUR2_*, E2E_INCIDENT_ID
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Playwright-Report (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
